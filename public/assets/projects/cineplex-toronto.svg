  <rect x="12.5" y="15.5" width="1175" height="561" rx="24.5" stroke="url(#hero-border)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="56" y="83" fill="#FCD34D" font-size="12" font-weight="700" letter-spacing="2.4">TORONTO CINEMA FIELD GUIDE</text>

    <text x="56" y="159" fill="#FAFAFA" font-size="54" font-weight="700" letter-spacing="-2.2">Pick the screen,</text>
    <text x="56" y="220" fill="#FACC15" font-size="54" font-weight="700" letter-spacing="-2.2">not just the showtime.</text>

    <text x="56" y="278" fill="#D4D4D4" font-size="17">Find the exact Cineplex auditorium that fits your film. Compare screen shape,</text>
    <text x="56" y="307" fill="#D4D4D4" font-size="17">viewing format, audio configuration, projector technology and more.</text>

    <rect x="56" y="341" width="151" height="41" rx="20.5" fill="#FACC15"/>
    <text x="75" y="367" fill="#171717" font-size="13" font-weight="700">Explore the directory</text>
    <text x="224" y="367" fill="#737373" font-size="13">Community-maintained reference</text>

    <path d="M56 425.5H1144" stroke="#FAFAFA" stroke-opacity=".11"/>

    <g fill="#737373" font-size="10.5" letter-spacing=".55">
      <text x="56" y="463">LOCATIONS</text>
      <text x="148" y="463">AUDITORIUMS</text>
      <text x="255" y="463">PREMIUM FORMATS</text>
      <text x="391" y="463">COVERAGE</text>
    </g>
    <g fill="#F5F5F5" font-weight="700">
      <text x="56" y="492" font-size="21">27</text>
      <text x="148" y="492" font-size="21">345</text>
      <text x="255" y="492" font-size="21">7</text>
      <text x="391" y="490" font-size="16">Greater Toronto Area</text>
