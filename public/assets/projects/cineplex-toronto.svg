      <stop stop-color="#F59E0B" stop-opacity=".15"/>
      <stop offset=".48" stop-color="#F59E0B" stop-opacity=".035"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-border" x1="48" y1="26" x2="1143" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCD34D" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#FCD34D" stop-opacity=".055"/>
      <stop offset="1" stop-color="#FCD34D" stop-opacity=".14"/>
    </linearGradient>
    <pattern id="grid" width="120" height="52" patternUnits="userSpaceOnUse">
      <path d="M0 51.5H120M119.5 0V52" stroke="#FAFAFA" stroke-opacity=".022"/>
