- type: quote
  tags: [agents]
  text: |
    The software factory is a system where software production becomes asynchronous from human attention. Humans define goals, workers execute, work gets correlated back to objectives, the system validates outputs, failures retry, bad changes get reverted or compensated, low-value failures get reconciled later, and high-risk actions escalate. The human spends their time improving the system instead of personally participating in every execution.
  source: https://x.com/unwitty/status/2091143479090885003
  author: Skynet's Thrall (@unwitty)
  title: The Software Factory Does Not Use Two-Phase Commit
  date: 2026-11-25

